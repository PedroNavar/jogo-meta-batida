<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Meta Batida Sipolatti</title><link rel="stylesheet" href="/css/jogo.css"><link rel="stylesheet" href="/css/admin.css"><script type="module" src="/js/admin.js"></script></head>
<body class="pagina-admin"><header class="marca"><img class="logo-cliente" src="/img/logo-sipolatti.svg" alt="Sipolatti" width="150" height="42"><span>ADMIN · META BATIDA</span><img class="logo-metta" src="/img/logo-metta.svg" alt="Metta" width="120" height="26"></header>
<main class="admin"><p class="sobretitulo">PAINEL DO INSTRUTOR</p><h1>Operação do jogo</h1><p id="mensagem" role="status" aria-live="polite"></p>
<form id="login" class="painel"><h2>Entrar no admin</h2><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button class="principal">Entrar</button></form>
<div id="aplicacao" hidden><div class="barra"><button id="atualizar" class="discreto">Atualizar dados</button><button id="sair" class="discreto">Sair</button></div><nav id="abas" aria-label="Áreas administrativas"></nav><section id="conteudo" class="painel"></section></div>
<dialog id="confirmacao" aria-labelledby="confirmar-titulo"><h2 id="confirmar-titulo">Confirmar ação</h2><p id="confirmar-texto"></p><div class="barra"><button id="cancelar" class="discreto">Cancelar</button><button id="confirmar" class="principal">Confirmar</button></div></dialog>
</main></body></html>
